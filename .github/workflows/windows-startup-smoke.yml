name: windows-startup-smoke

on:
  push:
    branches:
      - windows-startup-diagnosis-v106-20261105
      - windows-companion-playback-v107-20261105
  workflow_dispatch:

jobs:
  start-local-stack:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check one-click launcher syntax
        run: node --check scripts/start-ngrok.mjs
      - name: Verify local-first startup order
        shell: pwsh
        run: |
          $source = Get-Content scripts/start-ngrok.mjs -Raw
          $local = $source.IndexOf('正在先启动本地同屏')
          $tunnel = $source.IndexOf('正在连接固定 ngrok 隧道')
          if ($local -lt 0 -or $tunnel -lt 0 -or $local -ge $tunnel) {
            throw "One-click launcher does not start local TongPing before ngrok"
          }
      - name: Start TongPing and verify health
        shell: pwsh
        run: |
          $env:TONGPING_HOME = Join-Path $env:RUNNER_TEMP "tongping-smoke"
          $env:TONGPING_PORT = "45921"
          $env:TONGPING_HEADLESS = "1"
          $stdout = Join-Path $env:RUNNER_TEMP "tongping-out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "tongping-err.log"
          $process = Start-Process -FilePath node -ArgumentList "scripts/start.mjs" -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($process.HasExited) { break }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:45921/health" -TimeoutSec 2
                if ($health.service -eq "tongping") {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            if (-not $healthy) {
              throw "TongPing did not become healthy on Windows"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            Get-CimInstance Win32_Process |
              Where-Object { $_.CommandLine -like "*$env:TONGPING_HOME*" -or $_.CommandLine -like "*scripts/start.mjs*" } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
      - name: Run complete one-click launcher with isolated ngrok
        shell: pwsh
        run: |
          @'
          print("ngrok version fake")
          '@ | Set-Content -Path version -Encoding utf8
          @'
          import http.server
          import json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith("/api/tunnels"):
                      body = json.dumps({
                          "tunnels": [{
                              "public_url": "https://eatable-derail-moonscape.ngrok-free.dev",
                              "config": {"addr": "http://localhost:45931"}
                          }]
                      }).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  else:
                      self.send_response(404)
                      self.end_headers()

              def log_message(self, *_):
                  pass

          http.server.ThreadingHTTPServer(("127.0.0.1", 4040), Handler).serve_forever()
          '@ | Set-Content -Path http -Encoding utf8

          $tongpingTestHome = Join-Path $env:RUNNER_TEMP "tongping-one-click"
          @"
          TONGPING_HOME=$tongpingTestHome
          TONGPING_PORT=45931
          TONGPING_HEADLESS=1
          TONGPING_PUBLIC_ORIGIN=https://eatable-derail-moonscape.ngrok-free.dev
          "@ | Set-Content -Path .env -Encoding utf8

          # Reproduce the user's real failure: an older TongPing still owns the
          # port for a moment when the new one-click launcher starts.
          $env:TONGPING_HOME = $tongpingTestHome
          $env:TONGPING_PORT = "45931"
          $env:TONGPING_HEADLESS = "1"
          $env:TONGPING_PUBLIC_ORIGIN = "https://eatable-derail-moonscape.ngrok-free.dev"
          $staleOut = Join-Path $env:RUNNER_TEMP "stale-out.log"
          $staleErr = Join-Path $env:RUNNER_TEMP "stale-err.log"
          $stale = Start-Process -FilePath node -ArgumentList "scripts/start.mjs" -PassThru -NoNewWindow -RedirectStandardOutput $staleOut -RedirectStandardError $staleErr
          $staleHealthy = $false
          for ($i = 0; $i -lt 60; $i++) {
            if ($stale.HasExited) { break }
            try {
              $staleHealth = Invoke-RestMethod -Uri "http://127.0.0.1:45931/health" -TimeoutSec 2
              if ($staleHealth.service -eq "tongping") {
                $staleHealthy = $true
                break
              }
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $staleHealthy) {
            Get-Content $staleOut -ErrorAction SilentlyContinue
            Get-Content $staleErr -ErrorAction SilentlyContinue
            throw "Could not create stale TongPing listener for regression test"
          }

          $env:TONGPING_NGROK_BIN = "python"
          $stdout = Join-Path $env:RUNNER_TEMP "one-click-out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "one-click-err.log"
          $process = Start-Process -FilePath node -ArgumentList "scripts/start-ngrok.mjs" -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $healthy = $false
            for ($i = 0; $i -lt 90; $i++) {
              if ($process.HasExited) { break }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:45931/health" -TimeoutSec 2
                if ($health.service -eq "tongping") {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            $readyMarker = $false
            for ($i = 0; $i -lt 90; $i++) {
              if ($process.HasExited) { break }
              $partial = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
              if ($partial -and $partial.IndexOf("同屏和固定隧道均已就绪（启动器 v107）") -ge 0) {
                $readyMarker = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            Start-Sleep -Seconds 1
            $out = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
            $err = Get-Content $stderr -Raw -ErrorAction SilentlyContinue
            Write-Output $out
            Write-Output $err
            if (-not $readyMarker -or $process.HasExited) {
              throw "Complete one-click launcher did not reach the v107 ready marker"
            }
            if ($out.IndexOf("旧同屏已清理，端口已释放") -lt 0) {
              throw "Launcher did not clean the stale TongPing listener"
            }
            $localReady = $out.IndexOf("本地同屏已就绪")
            $tunnelStart = $out.IndexOf("正在连接固定 ngrok 隧道")
            $allReady = $out.IndexOf("同屏和固定隧道均已就绪")
            if ($localReady -lt 0 -or $tunnelStart -le $localReady -or $allReady -le $tunnelStart) {
              throw "One-click launcher lifecycle order was not observed"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            foreach ($port in 45931,4040) {
              Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty OwningProcess -Unique |
                ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
            }
          }
